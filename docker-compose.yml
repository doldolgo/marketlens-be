# EC2 배포용 — 백엔드(be) 컨테이너. DB 는 AWS RDS(PostgreSQL)를 사용한다.
# (로컬 개발 DB 는 docker-compose.dev.yml — 이 파일과 용도가 다르다)
#
# 배포 흐름: main 푸시 → GitHub Actions 가 EC2 에서 git pull 후
#   docker compose up -d --build
#
# EC2 에는 이 파일 옆에 .env 가 있어야 한다 (git 에 올라가지 않으므로 서버에
# 직접 한 번 만든다). 필요한 항목:
#   DATABASE_URL=postgresql://marketlens:<비밀번호>@<RDS엔드포인트>:5432/marketlens
#   REFRESH_TOKEN=랜덤문자열              ← POST /refresh 보호 (외부 노출 서버 필수)
#   UPBIT_API_KEY= / UPBIT_SECRET_KEY=    ← 입출금 상태 조회 (선택)
#   BINANCE_API_KEY= / BINANCE_SECRET_KEY=
#
# .env 가 없거나 DATABASE_URL 이 비어 있으면 배포 워크플로가 미리 실패시킨다.
services:
  be:
    build: .
    container_name: market-lens-be
    ports:
      - "8000:8000"
    restart: unless-stopped
    # .env 를 컨테이너 환경변수로 주입한다 (.dockerignore 가 이미지에서 .env 를
    # 제외하므로 이 지정이 없으면 컨테이너는 설정을 하나도 못 받는다).
    env_file: .env
